name: CI

# The same checks as the pre-push hook, so a push that skipped it (--no-verify) is still verified. They only run on
# pull requests: main is protected by a ruleset, so its content was always checked in the pull request that
# brought it. A draft pull request is not checked until it is marked ready; a change that touches only documentation
# runs no check; the Docker images are built only when something that goes into them changed, and for real (pushed)
# by release.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which parts of a pull request matter: the checks (anything but documentation and issue templates) and the images
  # (what goes into them).
  changes:
    name: Changed files
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.code.outputs.code }}
      images: ${{ steps.images.outputs.images }}
    steps:
      # "every": a file counts when it matches all the patterns, i.e. it is not excluded by one of them.
      - id: code
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.github/ISSUE_TEMPLATE/**'

      - id: images
        uses: dorny/paths-filter@v4
        with:
          filters: |
            images:
              - 'apps/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  check:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # `@youlearn/config` validates the environment as soon as it is imported (next typegen does it for the web
      # app). These placeholders only have to be well-formed: no check below talks to a database or a storage.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-0123456789
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: youlearn-ci
      S3_ACCESS_KEY: CI
      S3_SECRET_KEY: CI
      # Do not install the Git hooks on the runner.
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint:ci

      - name: Types
        run: pnpm check-types

      - name: Tests
        run: pnpm test

  # Every pull request is squash-merged, so its title becomes the commit message release-please reads.
  pr-title:
    name: Pull request title
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The images must keep building; they are only pushed by the release workflow. Skipped when no file that goes into
  # an image changed, and on the release pull request (version and changelog only: release.yml builds the images
  # when it is merged).
  docker:
    name: Docker image (${{ matrix.image }})
    needs: changes
    if: ${{ needs.changes.outputs.images == 'true' && !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # The only check to require on main. A skipped job (documentation only, no image change...) reports "skipped", and
  # a skipped matrix job would leave its templated name pending forever, so the required check is this one, not the
  # jobs above. A draft pull request skips everything, but cannot be merged anyway.
  ci:
    name: CI
    if: ${{ always() }}
    needs: [changes, check, pr-title, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
