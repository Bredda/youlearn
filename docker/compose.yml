name: youlearn
services:
  database:
    image: pgvector/pgvector:pg18-trixie
    restart: always
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-youlearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-youlearn}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: rustfs/rustfs:1.0.0
    restart: always
    ports:
      - ${S3_PORT:-9000}:9000
      - ${S3_CONSOLE_PORT:-9001}:9001
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-YOULEARNDEV}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-YOULEARNDEVSECRET}
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  storagedata:
